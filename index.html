<!DOCTYPE html>
<html lang="sk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mimkin vianočný odpočet</title>
    <link href="https://fonts.googleapis.com/css2?family=Mountains+of+Christmas:wght@700&family=Open+Sans:wght@400;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: linear-gradient(135deg, #3d0c11 0%, #7d1524 50%, #200407 100%);
            font-family: 'Open Sans', sans-serif;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            position: relative;
            overflow: hidden;
        }

        /* Sneženie - pevné pozície, aby sa hneď vykreslilo */
        .snow-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        .snowflake {
            position: absolute;
            background: #ffffff;
            border-radius: 50%;
            opacity: 0.9;
            animation: fall linear infinite;
        }

        @keyframes fall {
            0% {
                transform: translateY(-20px) translateX(0);
            }
            100% {
                transform: translateY(105vh) translateX(30px);
            }
        }

        .container {
            position: relative;
            z-index: 2;
            text-align: center;
            max-width: 900px;
            width: 100%;
            padding: 20px;
        }

        h1 {
            font-family: 'Mountains of Christmas', cursive;
            font-size: 4.5rem;
            color: #f3f4f6;
            margin-bottom: 30px;
            text-shadow: 2px 2px 8px rgba(0,0,0,0.6);
        }

        .countdown-box {
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 8px;
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding: 40px 20px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.6);
        }

        .time-segment {
            display: flex;
            flex-direction: column;
            align-items: center;
            flex: 1;
        }

        .time-value {
            font-size: 5rem;
            font-weight: 700;
            line-height: 1;
            color: #ffffff;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.4);
        }

        .time-segment.days .time-value {
            color: #f43f5e; 
        }

        .time-label {
            font-size: 1.1rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-top: 15px;
            color: #e2e8f0;
            font-weight: 700;
        }

        @media (max-width: 768px) {
            h1 { font-size: 3rem; }
            .countdown-box { flex-direction: column; gap: 25px; }
            .time-value { font-size: 4rem; }
        }
    </style>
</head>
<body>

    <div class="snow-container" id="snowContainer"></div>

    <div class="container">
        <h1>Odpočet do Mimkinej vianočnej dovolenky</h1>
        
        <div class="countdown-box">
            <div class="time-segment days">
                <div class="time-value" id="days">--</div>
                <div class="time-label">D</div>
            </div>
            <div class="time-segment">
                <div class="time-value" id="hours">--</div>
                <div class="time-label">H</div>
            </div>
            <div class="time-segment">
                <div class="time-value" id="minutes">--</div>
                <div class="time-label">M</div>
            </div>
            <div class="time-segment seconds">
                <div class="time-value" id="seconds">--</div>
                <div class="time-label">S</div>
            </div>
        </div>
    </div>

    <script>
        // Generovanie snehových vločiek hneď pri štarte
        const snowContainer = document.getElementById('snowContainer');
        const count = 60;

        for (let i = 0; i < count; i++) {
            const sf = document.createElement('div');
            sf.className = 'snowflake';
            const size = (Math.random() * 4 + 2) + 'px';
            sf.style.width = size;
            sf.style.height = size;
            sf.style.left = Math.random() * 100 + 'vw';
            sf.style.top = (Math.random() * -100) + 'px';
            sf.style.animationDuration = (Math.random() * 4 + 3) + 's';
            sf.style.animationDelay = (Math.random() * 5) + 's';
            snowContainer.appendChild(sf);
        }

        // Cielový dátum: 18. december 2026, 15:00:00
        const targetTime = new Date('2026-12-18T15:00:00').getTime();

        function runCountdown() {
            const now = new Date().getTime();
            const diff = targetTime - now;

            if (diff <= 0) {
                document.getElementById("days").innerText = "00";
                document.getElementById("hours").innerText = "00";
                document.getElementById("minutes").innerText = "00";
                document.getElementById("seconds").innerText = "00";
                return;
            }

            const d = Math.floor(diff / (1000 * 60 * 60 * 24));
            const h = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const m = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
            const s = Math.floor((diff % (1000 * 60)) / 1000);

            document.getElementById("days").innerText = String(d).padStart(2, '0');
            document.getElementById("hours").innerText = String(h).padStart(2, '0');
            document.getElementById("minutes").innerText = String(m).padStart(2, '0');
            document.getElementById("seconds").innerText = String(s).padStart(2, '0');
        }

        // Spustiť ihneď a potom každú sekundu
        runCountdown();
        setInterval(runCountdown, 1000);
    </script>
</body>
</html>
